services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: hospitality
      POSTGRES_PASSWORD: local_only_change_me
      POSTGRES_DB: hospitality
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hospitality -d hospitality"]
      interval: 5s
      timeout: 3s
      retries: 15
    volumes:
      - hospitality_pg:/var/lib/postgresql/data
volumes:
  hospitality_pg:
