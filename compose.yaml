services:
  postgres:
    image: postgres:17-alpine
    environment:
      # Local development only. Production needs separate secrets/configuration.
      POSTGRES_USER: ${POSTGRES_USER:-hospitality}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_only_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-hospitality}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 15
    volumes:
      - hospitality_pg:/var/lib/postgresql/data
  app:
    image: hospitality:${VERSION:-dev}
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-unknown}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    environment:
      HTTP_ADDR: 0.0.0.0:8000
      DATABASE_URL: postgres://${POSTGRES_USER:-hospitality}:${POSTGRES_PASSWORD:-local_only_change_me}@postgres:5432/${POSTGRES_DB:-hospitality}?sslmode=disable
      DATABASE_TIMEOUT: 2s
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8000/readyz"]
      interval: 5s
      timeout: 3s
      retries: 10
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
volumes:
  hospitality_pg:
