name: Temporary Go Formatting Export (Issue 22)
on:
  push:
    branches: [feat/22-pms-property-rooms]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: .go-version
      - name: Format changed PMS Go files and export text
        run: |
          set -euo pipefail
          files=(
            internal/modules/pms/api/http.go
            internal/modules/pms/application/service.go
            internal/modules/pms/application/service_test.go
            internal/modules/pms/infrastructure/postgres.go
            internal/modules/pms/infrastructure/postgres_integration_test.go
          )
          gofmt -w "${files[@]}"
          for file in "${files[@]}"; do
            echo "FORMAT_BEGIN ${file}"
            base64 -w0 "$file"
            echo
            echo "FORMAT_END ${file}"
          done
