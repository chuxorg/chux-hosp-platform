name: Quality

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [master]

jobs:
  bootstrap-validation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate Conventional Commit PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! printf '%s\n' "$PR_TITLE" | grep -Eq '^(feat|fix|test|docs|refactor|chore|ci|build|perf|style|revert)(\([[:alnum:]_. /-]+\))?(!)?: .+'; then
            echo "PR title must use Conventional Commits (it becomes the squash commit title)." >&2
            exit 1
          fi
      - name: Validate bootstrap policy
        run: bash scripts/validate.sh

# IMPORTANT: This does NOT run application unit tests. When the stack is selected,
# add mandatory lint/type/test/migration jobs and replace the src/app/packages guard.
