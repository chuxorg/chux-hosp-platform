name: Quality

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  sqlite-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install package and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run validation (unit and SQLite integration)
        run: bash scripts/validate.sh
      - name: Validate Conventional Commit PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$PR_TITLE" | grep -Eq '^(feat|fix|test|docs|refactor|chore|ci|build|perf|style|revert)(\([[:alnum:]_. /-]+\))?(!)?: .+'
  postgres-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: hospitality_test
          POSTGRES_USER: hospitality
          POSTGRES_PASSWORD: local_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hospitality -d hospitality_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://hospitality:local_test_only@localhost:5432/hospitality_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install package and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run real PostgreSQL integration tests
        run: python -m pytest -q -m integration
  bootstrap-validation:
    name: bootstrap-validation
    if: always()
    needs: [sqlite-tests, postgres-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Require every test job to pass
        env:
          SQLITE_RESULT: ${{ needs.sqlite-tests.result }}
          PG_RESULT: ${{ needs.postgres-tests.result }}
        run: |
          test "$SQLITE_RESULT" = success
          test "$PG_RESULT" = success
