[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "hospitality-platform"
version = "0.1.0"
description = "Greenfield Hospitality PMS/CRM and Experience platform"
requires-python = ">=3.13,<3.15"
dependencies = [
  "fastapi>=0.128,<1",
  "uvicorn>=0.48,<1",
  "SQLAlchemy>=2.0.50,<2.2",
  "alembic>=1.18,<2",
  "psycopg[binary]>=3.3,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=9,<10",
  "httpx>=0.28,<1",
  "ruff>=0.14,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hospitality"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: exercises the actual database and HTTP stack"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
